[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scbkr-local-responsibility-model"
version = "2.1.0"
description = "SCBKR local-first rule OS and AI chat product"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.111",
  "opencc>=1.1.9,<2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx2>=2.10,<3",
]
token-meter = [
  "tiktoken>=0.9.0",
  "transformers>=4.50.0",
]
cost-gateway = [
  "litellm>=1.74.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "apps*",
  "core*",
  "config*",
  "schemas*",
]
exclude = [
  "data*",
  "dist*",
  "tests*",
  "apps.web*",
  "apps.desktop*",
  "node_modules*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
